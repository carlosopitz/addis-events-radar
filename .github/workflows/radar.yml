name: radar

on:
  schedule:
    - cron: "17 */2 * * *"   # check every 2 hours
    - cron: "41 4 * * 1"     # link discovery every Monday, 07:41 Addis time
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: check
        options: [check, discover, both, snapshot, probe]
      probe:
        description: "For probe: comma-separated Telegram handles or URLs"
        type: string
        default: ""
  push:
    branches: [main]
    paths: [sources.yaml]    # re-check right after the source list is edited

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decide what to run
        id: t
        run: |
          T="${{ inputs.task }}"
          case "${{ github.event.schedule }}" in
            "41 4 * * 1") T=discover ;;
          esac
          [ -z "$T" ] && T=check
          echo "task=$T" >> "$GITHUB_OUTPUT"
          echo "Running: $T"

      - name: Discover social links and feeds
        if: steps.t.outputs.task == 'discover' || steps.t.outputs.task == 'both'
        run: python radar/radar.py discover

      - name: Check all channels
        if: steps.t.outputs.task == 'check' || steps.t.outputs.task == 'both'
        run: python radar/radar.py check

      - name: Probe candidate channels (debugging)
        if: steps.t.outputs.task == 'probe'
        env:
          PROBE: ${{ inputs.probe }}
        run: python radar/radar.py probe

      - name: Save page snapshots (debugging)
        if: steps.t.outputs.task == 'snapshot'
        run: python radar/radar.py snapshot

      - name: Save data
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if [ -d debug ]; then git add debug; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
