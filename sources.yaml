# Addis Events Radar: the source database
# ------------------------------------------------------------------
# One entry per embassy, cultural institute or event source in Addis Ababa.
# Edit this file (on GitHub: pencil icon) to add, fix or remove sources.
# The monitor re-runs automatically after every edit.
#
# Fields
#   id        short unique slug
#   name      display name
#   country   ISO 2-letter code (drives the flag), EU for EU bodies, ET for local
#   kind      cultural | embassy | eu | aggregator
#   region    europe | americas | asia-pacific | local
#   homepage  main website (also used by the weekly link discovery)
#   links     curated links shown in the directory (x, facebook, instagram,
#             telegram, youtube, linkedin, newsletter, bluesky ...)
#   manual    why a source is not checked automatically (shown on its card)
#   match     regex: posts from ANY channel that mention this name are also
#             listed under this source (useful for venues with no feed)
#   channels  what the monitor actually checks:
#     type: web       a news/events page; new links on it become new items
#                     include: regex a link must match (keeps menus out)
#                     exclude: regex for links to ignore
#                     selector: CSS selector for the list area (optional)
#                     blocks: CSS selector for posts shown inline, without links
#     type: rss       an RSS/Atom feed (also for RSS.app feeds of X/Facebook/
#                     Instagram, Bluesky profile feeds, Kill the Newsletter)
#     type: telegram  a public Telegram channel name (read via t.me/s/)
#     type: gnews     a Google News search query (press coverage)
#                     lang: es | fr | de | it to search that language's edition
#     type: json      a site's own JSON news endpoint (base: site root for links)
#     label: optional display label for the channel
# ------------------------------------------------------------------

